# docs/09 §4.1 연구실 기본 마커 배치. 설치 후 실측값(mm 단위)으로 x, z 를 갱신해서 쓴다.
# 좌표계 M: x = 마커 열 방향(진행 방향), y = 벽 안쪽(0 = 벽 평면), z = 위. 단위 m.
name: lab_default
tag_family: tag36h11
default_size_m: 0.15            # [결정 필요] 검은 테두리 외곽 기준
markers:
  # 하단열: 중심 높이 60 cm (고도 0.6 m 조건)
  - {id: 0,  x: 0.0, z: 0.60}
  - {id: 1,  x: 1.0, z: 0.60}
  - {id: 2,  x: 2.0, z: 0.60}
  - {id: 3,  x: 3.0, z: 0.60}
  - {id: 4,  x: 4.0, z: 0.60}
  - {id: 5,  x: 5.0, z: 0.60}
  - {id: 6,  x: 5.5, z: 0.60}
  # 상단열: 중심 높이 200 cm (고도 2.0 m 조건)
  - {id: 10, x: 0.0, z: 2.00}
  - {id: 11, x: 1.0, z: 2.00}
  - {id: 12, x: 2.0, z: 2.00}
  - {id: 13, x: 3.0, z: 2.00}
  - {id: 14, x: 4.0, z: 2.00}
  - {id: 15, x: 5.0, z: 2.00}
  - {id: 16, x: 5.5, z: 2.00}
