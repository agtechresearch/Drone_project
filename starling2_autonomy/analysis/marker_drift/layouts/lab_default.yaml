# docs/09 §4.1 연구실 기본 마커 배치. 설치 후 실측값(mm 단위)으로 x, z 를 갱신해서 쓴다.
#   2026-09-23 확정: 0.5 m 간격.  2026-11-09 변경(사용자): 태그 ID 0~10 (11개, 비행 5.0 m), 크기 20 cm, 이격 70 cm.
# 좌표계 M: x = 마커 열 방향(진행 방향), y = 벽 안쪽(0 = 벽 평면), z = 위. 단위 m.
name: lab_default
tag_family: tag36h11
default_size_m: 0.20            # 2026-11-09: 20 cm (검은 테두리 외곽 기준). 현수막 높이 50 cm 안에 들어간다
standoff_m: 0.70                # 기체(카메라) 와 현수막 평면 사이 거리 (참고값, 비행 스크립트 --standoff 와 맞출 것)
markers:
  # 하단열: 중심 높이 60 cm (고도 0.6 m 조건), ID 0~10, 현수막 5 m 안
  - {id: 0 , x: 0.0, z: 0.60}
  - {id: 1 , x: 0.5, z: 0.60}
  - {id: 2 , x: 1.0, z: 0.60}
  - {id: 3 , x: 1.5, z: 0.60}
  - {id: 4 , x: 2.0, z: 0.60}
  - {id: 5 , x: 2.5, z: 0.60}
  - {id: 6 , x: 3.0, z: 0.60}
  - {id: 7 , x: 3.5, z: 0.60}
  - {id: 8 , x: 4.0, z: 0.60}
  - {id: 9 , x: 4.5, z: 0.60}
  - {id: 10, x: 5.0, z: 0.60}
  # 상단열: 중심 높이 200 cm (고도 2.0 m 조건 C), ID 20~30. 설치 여부는 조건 C 진행 시 확정 [미확정]
  - {id: 20, x: 0.0, z: 2.00}
  - {id: 21, x: 0.5, z: 2.00}
  - {id: 22, x: 1.0, z: 2.00}
  - {id: 23, x: 1.5, z: 2.00}
  - {id: 24, x: 2.0, z: 2.00}
  - {id: 25, x: 2.5, z: 2.00}
  - {id: 26, x: 3.0, z: 2.00}
  - {id: 27, x: 3.5, z: 2.00}
  - {id: 28, x: 4.0, z: 2.00}
  - {id: 29, x: 4.5, z: 2.00}
  - {id: 30, x: 5.0, z: 2.00}
