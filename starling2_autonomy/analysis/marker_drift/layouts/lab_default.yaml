# docs/09 §4.1 연구실 기본 마커 배치 (2026-09-23 확정: 0.5 m 간격). 설치 후 실측값(mm 단위)으로 x, z 를 갱신해서 쓴다.
# 좌표계 M: x = 마커 열 방향(진행 방향), y = 벽 안쪽(0 = 벽 평면), z = 위. 단위 m.
name: lab_default
tag_family: tag36h11
default_size_m: 0.07            # 확정 2026-09-23: 6~7 cm (Bee35 기준 계승), 검은 테두리 외곽 기준
