# ============================================================
# QVIX R Module - 딸기 재배대 자율 촬영 임무
#
# 이 파일은 "이번 임무에서는 이렇게 한다"를 담음.
#   - 실험/현장마다 갱신
#   - 안전 정책, 정렬 tolerance, 게인, 마커 시퀀스
#   - 임무 시작/종료 조건, 하드코딩 백업 시퀀스
#
# 환경/하드웨어 설정(폰, 카메라, UI 좌표 등)은 config.yaml에.
#
# 마커 ID 체계:
#   0-9   : 동작 마커 (정렬 필수, 여러 위치에서 재사용 가능)
#           - 0: 이륙 후 정렬/녹화 시작
#           - 1: 상승 (층 전환용, 여러 위치에 반복 배치)
#           - 9: 종료/귀환
#           - 나머지(2-8): 예비
#   10-19 : 1층 마커 (경유, 스킵 허용)
#   20-29 : 2층 마커
#   30-39 : 3층 마커
# ============================================================

mission:
  # ---------- 이륙 후 초기 액션 ----------
  post_takeoff:
    settle_time_s: 3
    initial_actions: []

  start_wait_timeout_s: 60

  # ---------- 안전 정책 ----------
  safety:
    # 거리 관리 (앞뒤 = z축)
    min_distance_mm: 400            # 이하 → 긴급 후진
    max_distance_mm: 600            # 이상 → 전진 (마커 접근)

    # 정렬 허용치 (마커가 화면에서 이 범위 밖이면 오버라이드로 정렬)
    lateral_tolerance_mm: 100       # 좌우 편차 허용
    vertical_tolerance_mm: 150      # 상하 편차 허용

    # 마커 잃음 처리 (마커 없어도 이 시간까지 hover 유지)
    lost_timeout_s: 60

    # 마커 잃음 시 마지막 waypoint 방향 유지 (다음 마커 나올 때까지)
    # 이 시간 지나면 hover
    continue_on_lost_s: 10.0

    # 안전 오버라이드 강도 제어
    backoff_stick_px: 50            # min_distance 위반 시 후진 강도 (고정값)
    kp_lateral: 0.15                # 좌우 보정 게인 (mm→px)
    kp_vertical: 0.15               # 상하 보정 게인 (mm→px)
    kp_forward: 0.15                # 앞뒤 보정 게인 (mm→px)
    max_override_stick_px: 40       # 오버라이드 offset 상한 (급조종 방지)
    min_effective_stick_px: 25      # 오버라이드 offset 하한 (가상 조이스틱 데드밴드 보상)
                                    # 0이 아닌 스틱 값이 이보다 작으면 이 값까지 끌어올림

  # ---------- 마커 시퀀스 ----------
  # 정렬 필수 규칙:
  #   - id < 10 (동작 마커: 0=시작, 1=상승, 9=종료 등)는 자동으로 정렬 필수.
  #   - 정렬 필수 마커 바로 다음 인덱스도 정렬 필수 (재정렬로 안정성 확보).
  #     예: id=1(상승) → id=20(2층 시작)에서 다시 정렬 후 진행.
  #   - id ≥ 10 (경유 마커)는 기본 스킵 허용. 감지되자마자 지나갈 수 있음.
  #   - 특정 경유 마커도 정렬 강제하려면 `require_alignment: true` 명시.
  #
  # speed 튜닝: 배터리 테스트 결과 스틱 반경 대비 25% 이하는 Neo가 반응 못 함.
  # 최소 60 이상 권장 (radius 241 기준).
  sequence:
    # ── [동작 0] 이륙 후 정렬 → 녹화 시작 ──
    - {id: 0,  action: hover, role: start, speed: 0}

    # ── 1층: 우측 진행 (id 10, 11) ──
    - {id: 10, action: right, speed: 60}
    - {id: 11, action: right, speed: 60}

    # ── [동작 1] 상승 ──
    - {id: 1,  action: ascend, speed: 70}

    # ── 2층: 좌측 진행 (id 20, 21) ──
    - {id: 20, action: left, speed: 60}
    - {id: 21, action: left, speed: 60}

    # ── [동작 9] 귀환/종료 ──
    - {id: 9,  action: end, role: end, speed: 0}

  # ---------- 임무 종료 처리 ----------
  on_complete:
    auto_landing: true
    stop_recording: true

  # ---------- 하드코딩 백업 시퀀스 (--mode hardcoded 실행 시 사용) ----------
  # 마커 탐지 실패 대비 백업 모드. 이륙 → 첫 마커(id=0) 정렬 → 녹화 시작
  # 이후는 아래 리스트를 순차 실행 (마커 감지 무시, 시간 기반 스틱 명령).
  #
  # 각 항목:
  #   stick    : 'left', 'right', 'none'/null (호버=대기)
  #   offset   : [x, y] px. left/right 스틱의 오프셋
  #     좌스틱  x: yaw   / y-: 상승  / y+: 하강
  #     우스틱  x-: 좌   / x+: 우    / y-: 전진 / y+: 후진
  #   duration : 이 명령 유지 시간 (초)
  #   comment  : 로그용 설명 (선택)
  #
  # ★ 실기 튜닝 필수. 아래는 예시. 현장에서 각 재배대 사이 이동 시간 측정 후 조정.
  hardcoded_after_start:
    # ── 1층: 우측 진행 (예: 3개 재배대 이동) ──
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "1층 우측 이동 1"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "1층 호버 (촬영 안정화)"}
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "1층 우측 이동 2"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "1층 호버"}
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "1층 우측 이동 3"}

    # ── 상승: 1층 → 2층 (약 60cm) ──
    - {stick: left,  offset: [0, -70], duration: 2.5, comment: "1→2층 상승"}
    - {stick: none,  offset: [0, 0],   duration: 2.0, comment: "상승 후 안정화"}

    # ── 2층: 좌측 진행 (역방향) ──
    - {stick: right, offset: [-60, 0], duration: 3.0, comment: "2층 좌측 이동 1"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "2층 호버"}
    - {stick: right, offset: [-60, 0], duration: 3.0, comment: "2층 좌측 이동 2"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "2층 호버"}
    - {stick: right, offset: [-60, 0], duration: 3.0, comment: "2층 좌측 이동 3"}

    # ── 상승: 2층 → 3층 ──
    - {stick: left,  offset: [0, -70], duration: 2.5, comment: "2→3층 상승"}
    - {stick: none,  offset: [0, 0],   duration: 2.0, comment: "상승 후 안정화"}

    # ── 3층: 우측 진행 ──
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "3층 우측 이동 1"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "3층 호버"}
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "3층 우측 이동 2"}
    - {stick: none,  offset: [0, 0],   duration: 1.5, comment: "3층 호버"}
    - {stick: right, offset: [60, 0],  duration: 3.0, comment: "3층 우측 이동 3"}

    # 종료 (녹화 종료 + 착륙은 자동)