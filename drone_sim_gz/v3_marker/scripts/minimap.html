<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QVIX 미니맵</title>
<style>
:root{--bg:#f3f5f2;--fg:#1d2420;--muted:#5e6a62;--line:#d5dcd6;--panel:#fff;--rack:#c9d3cb;--est:#1f6fd9;--truth:#d9731f;--tag:#2f8f4e;--bad:#c23b3b}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--fg:#e3e8e4;--muted:#96a29a;--line:#2b332e;--panel:#1a201c;--rack:#2f3a33;--est:#5aa0ff;--truth:#f08a35;--tag:#4fc07a;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;height:100vh}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}}
#wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:420px;position:relative}
canvas{width:100%;height:100%;display:block}
aside{display:grid;gap:10px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
h1{font-size:16px;margin:0 0 4px}.muted{color:var(--muted);font-size:12px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}dt{color:var(--muted);font-size:12.5px}
dd{margin:0;font:12.5px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:12.5px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.ok{color:var(--tag)}.bad{color:var(--bad)}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
</style></head><body>
<main>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside>
    <div class="card"><h1>QVIX 미니맵</h1><div class="muted" id="run">연결 중…</div>
      <div class="muted" id="cond"></div>
      <div style="margin-top:8px">방 <select id="room"><option>R1</option><option>R2</option></select></div></div>
    <div class="card legend"><span><i class="sw" style="background:var(--est)"></i>추정 위치</span><span><i class="sw" style="background:var(--truth)"></i>진실값(시뮬)</span><span><i class="sw" style="background:var(--tag)"></i>태그</span></div>
    <div class="card"><dl>
      <dt>단계</dt><dd id="stage">–</dd>
      <dt>보정 적용</dt><dd id="ready">–</dd>
      <dt>추정 x, y</dt><dd id="pos">–</dd>
      <dt>추정 헤딩</dt><dd id="hd">–</dd>
      <dt>표준편차</dt><dd id="sd">–</dd>
      <dt>진실 대비</dt><dd id="err">–</dd>
      <dt>갱신 수</dt><dd id="cnt">–</dd>
    </dl></div>
    <div class="card"><dl>
      <dt>최근 태그</dt><dd id="tag">–</dd>
      <dt>최근 ToF</dt><dd id="tof">–</dd>
    </dl></div>
  </aside>
</main>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let M=null,recs=[],n=0,truth=null,trail=[],run=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $=id=>document.getElementById(id);
function view(){const r=M.rooms[$('room').value];const W=cv.clientWidth,H=cv.clientHeight;
  const x0=-0.2,x1=M.x_max+0.2,y0=r.y[0]-0.3,y1=r.y[1]+0.3;const s=Math.min(W/(x1-x0),H/(y1-y0));
  const ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;return {s,X:x=>ox+(x-x0)*s,Y:y=>H-oy-(y-y0)*s}}
function tri(v,x,y,comp,col,fill){const a=comp*Math.PI/180,fx=Math.sin(a),fy=Math.cos(a),L=0.22*v.s,Wd=0.11*v.s;
  const px=v.X(x),py=v.Y(y);ctx.beginPath();ctx.moveTo(px+fx*L,py-fy*L);ctx.lineTo(px-fx*L*0.5+fy*Wd,py+fy*L*0.5+fx*Wd);
  ctx.lineTo(px-fx*L*0.5-fy*Wd,py+fy*L*0.5-fx*Wd);ctx.closePath();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();if(fill){ctx.fillStyle=col;ctx.fill()}}
function draw(){if(!M)return;const dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const v=view(),room=$('room').value,r=M.rooms[room];ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  ctx.strokeStyle=css('--line');ctx.lineWidth=1;ctx.strokeRect(v.X(0),v.Y(r.y[1]),M.x_max*v.s,(r.y[1]-r.y[0])*v.s);
  ctx.fillStyle=css('--muted');ctx.font='11px system-ui';
  for(let y=Math.ceil(r.y[0]);y<=r.y[1];y++){ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(v.X(0),v.Y(y));ctx.lineTo(v.X(M.x_max),v.Y(y));ctx.stroke();ctx.globalAlpha=1}
  for(const k of M.racks.filter(k=>k.room==room)){ctx.fillStyle=css('--rack');ctx.fillRect(v.X(k.x0),v.Y(k.y1),(k.x1-k.x0)*v.s,(k.y1-k.y0)*v.s)}
  ctx.fillStyle=css('--muted');for(const [a,[x0,x1]] of Object.entries(M.aisles)){ctx.fillText(a,v.X((x0+x1)/2)-3,v.Y(r.y[0])+14)}
  for(const t of M.tags){if(t.y<r.y[0]||t.y>r.y[1])continue;ctx.fillStyle=css('--tag');ctx.beginPath();ctx.arc(v.X(t.x),v.Y(t.y),3,0,7);ctx.fill();
    ctx.fillText(t.id,v.X(t.x)+4,v.Y(t.y)-4)}
  const tr=c=>{ctx.beginPath();trail.forEach((p,i)=>{const q=c=='e'?[p.x,p.y]:p.t;if(!q)return;i?ctx.lineTo(v.X(q[0]),v.Y(q[1])):ctx.moveTo(v.X(q[0]),v.Y(q[1]))});ctx.stroke()};
  ctx.lineWidth=1.5;ctx.strokeStyle=css('--truth');ctx.globalAlpha=.6;tr('t');ctx.strokeStyle=css('--est');tr('e');ctx.globalAlpha=1;
  const e=recs[recs.length-1];
  if(e&&e.tag&&e.tag.id!=null){const t=M.tags.find(q=>q.id==e.tag.id);if(t){ctx.setLineDash([4,4]);ctx.strokeStyle=e.tag.ok?css('--tag'):css('--bad');ctx.beginPath();ctx.moveTo(v.X(e.x),v.Y(e.y));ctx.lineTo(v.X(t.x),v.Y(t.y));ctx.stroke();ctx.setLineDash([])}}
  if(truth)tri(v,truth.x,truth.y,truth.comp,css('--truth'),false);
  if(e){ctx.strokeStyle=css('--est');ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(v.X(e.x),v.Y(e.y),Math.max(2,2*e.sd[0]*v.s),Math.max(2,2*e.sd[1]*v.s),0,0,7);ctx.stroke();ctx.globalAlpha=1;tri(v,e.x,e.y,e.comp,css('--est'),true)}}
const f=(x,d=3)=>x==null?'–':(+x).toFixed(d);
function panel(){const e=recs[recs.length-1];if(!e)return;
  $('stage').textContent=e.stage||'–';$('ready').textContent=e.ready?'적용 중':'대기 (스캔)';
  $('pos').textContent=f(e.x)+', '+f(e.y)+' m';$('hd').textContent=f(e.comp,2)+'° (cY '+f(e.cY,2)+'°)';
  $('sd').textContent=f(e.sd[0]*100,1)+' / '+f(e.sd[1]*100,1)+' cm, '+f(e.sd[2],2)+'°';
  $('cnt').textContent='태그 '+e.n[0]+' · ToF 거리 '+e.n[1]+' · 각도 '+e.n[2]+' · 기각 '+e.n[3];
  if(truth){const dx=e.x-truth.x,dy=e.y-truth.y,dh=((e.comp-truth.comp+540)%360)-180;$('err').textContent=f(Math.hypot(dx,dy)*100,1)+' cm, '+f(dh,2)+'°'}
  const t=e.tag;$('tag').innerHTML=t?`<span class="${t.ok?'ok':'bad'}">#${t.id} ${t.ok?'반영':'기각'}</span> χ² ${t.chi2}`:'–';
  const o=e.tof;$('tof').innerHTML=o?`${o.face} d ${f(o.d)} m α ${f(o.alpha,2)}° <span class="${o.ok_d?'ok':'bad'}">${o.ok_d?'거리 반영':'거리 기각'}</span>${o.ok_a==null?'':o.ok_a?' <span class=ok>각도 반영</span>':' <span class=bad>각도 기각</span>'}`:'–'}
async function poll(){try{const s=await (await fetch('/state?since='+n)).json();
    if(s.run!==run){run=s.run;recs=[];trail=[];n=0;$('run').textContent=run||'비행 없음';$('cond').textContent=s.cond}
    else{if(s.recs.length){recs=recs.concat(s.recs).slice(-50);for(const r of s.recs)trail.push({x:r.x,y:r.y,t:null})}n=s.n}
    truth=s.truth;if(truth&&trail.length)trail[trail.length-1].t=[truth.x,truth.y];if(trail.length>4000)trail=trail.slice(-4000);
    if(recs.length){const y=recs[recs.length-1].y;$('room').value=y<11?'R1':'R2'}
    panel();draw()}catch(e){$('run').textContent='서버 연결 끊김'}setTimeout(poll,200)}
fetch('/map').then(r=>r.json()).then(m=>{M=m;draw();poll()});addEventListener('resize',draw);$('room').onchange=draw;
</script></body></html>
