# Navigation parameter overrides for myAGV mecanum robot
# Loaded LAST in navigation.launch so these values win over myagv_navigation defaults

local_costmap:
  global_frame: odom          # MUST be odom, not map — local costmap follows robot
  robot_base_frame: base_footprint
  update_frequency: 5.0       # was 0.3 Hz (too slow); 5 Hz keeps costmap fresh
  publish_frequency: 2.0
  rolling_window: true
  width: 3.0
  height: 3.0
  resolution: 0.05
  transform_tolerance: 2.0    # was 1.2; tolerate ~1s TF staleness from serial gaps
  inflation_radius: 0.20

  plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    obstacle_range: 2.5
    raytrace_range: 3.0
    track_unknown_space: false   # false → unknown = free, prevents Cost:-1 blocking recovery
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true

  inflation_layer:
    enabled: true
    cost_scaling_factor: 5.0
    inflation_radius: 0.20

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 1.0       # was 0.3 Hz; 1 Hz is adequate for static map
  publish_frequency: 0.5
  static_map: true
  rolling_window: false
  transform_tolerance: 2.0    # was 1.0; tolerate TF staleness

  plugins:
  - {name: static_layer,   type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    obstacle_range: 2.5
    raytrace_range: 3.0
    track_unknown_space: false
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true

  inflation_layer:
    enabled: true
    cost_scaling_factor: 5.0
    inflation_radius: 0.20

# 최종 방향(yaw) 회전 버벅임/헤맴 수정 (2026-07-13)
# 문제: max_vel_theta(0.1)가 min_in_place_vel_theta(0.25)보다 낮아 제자리회전이 캡에 걸려 버벅임.
#       latch_xy_goal_tolerance=false라 위치 도달 후 방향 돌리다 목표점에서 왔다갔다(헤맴).
# theta(회전)만 조정 — 병진(x/y) 미변경이라 데드밴드/메카넘 mix와 무관.
TrajectoryPlannerROS:
  max_vel_theta: 0.5           # 0.1 → 0.5 (제자리회전 최소 0.25 위로, 모순 해소)
  min_vel_theta: -0.5          # -0.1 → -0.5
  latch_xy_goal_tolerance: true  # 위치 도달 후 방향만 돌림(목표점 헤맴 방지)
