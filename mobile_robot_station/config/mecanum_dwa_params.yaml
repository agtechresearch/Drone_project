# 메카넘 휠 최적화 DWA 로컬 플래너 파라미터
# 기존 myagv_ros 설정(max_vel_y=0.0)은 측면 이동을 비활성화하므로
# 메카넘 휠의 장점을 살리려면 아래 파라미터를 적용하세요.
#
# 적용 방법 (네비게이션 실행 중):
#   rosrun dynamic_reconfigure dynparam load /move_base/DWAPlannerROS \
#       /home/er/autonomous_nav/config/mecanum_dwa_params.yaml

DWAPlannerROS:
  # 이동 속도
  max_vel_trans: 0.15
  min_vel_trans: 0.05
  max_vel_x: 0.20
  min_vel_x: -0.10
  max_vel_y: 0.15      # 메카넘 측면 이동 활성화 (기존: 0.0)
  min_vel_y: -0.15     # 메카넘 측면 이동 활성화 (기존: 0.0)
  max_vel_theta: 0.5
  min_vel_theta: 0.15

  # 가속도 제한
  acc_lim_x: 0.4
  acc_lim_y: 0.3       # 메카넘 y축 가속도 제한 (기존: 0.0)
  acc_lim_theta: 3.0
  acc_lim_trans: 0.2

  # 목표 도달 허용 오차
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  trans_stopped_vel: 0.05
  theta_stopped_vel: 0.1

  # 시뮬레이션 (Pi4 부하 완화: sim_time 단축 + granularity 확대)
  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.1

  # 샘플링 — Pi4에서 제어루프(5Hz)를 못 따라가 cmd_vel을 못 내던 문제로 대폭 축소.
  #   기존 30×15×40=18,000 궤적 → 8×4×12=384 궤적 (약 47배 경량화). 횡이동(vy)은 유지.
  vx_samples: 8
  vy_samples: 4        # 메카넘 y 샘플링 (기존 15에서 축소, 유지)
  vth_samples: 12

  # 비용 함수 가중치
  path_distance_bias: 28.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05

  # 기타
  prune_plan: true
  oscillation_reset_dist: 0.05
  forward_point_distance: 0.25
  use_dwa: true
